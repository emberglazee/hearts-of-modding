[package]
name = "hom-lsp"
version = "0.25.1"
edition = "2024"

[[bin]]
name = "hom-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp-server = "0.23.0"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
nom = "8.0.0"
nom_locate = "5.0.0"
dashmap = { version = "6.2.1", features = ["serde"] }
once_cell = "1.21.4"
regex = "1.13.1"
futures = "0.3.33"
sysinfo = "0.39.6"
base64 = "0.23.1"
arc-swap = "1.9.2"
paste = { package = "pastey", version = "0.2.3" }
rustc-hash = "2.1.3"
smallvec = "1.15.2"
tikv-jemallocator = "0.7.0"
tokio-util = "0.7.19"

[build-dependencies]
serde_json = "1.0.151"

[patch.crates-io]
tikv-jemalloc-sys = { git = "https://github.com/emberglazee/jemallocator", rev = "fca9a5ea15704a0bff6685c5d4f07c4ef01fa8b8" }
tikv-jemallocator = { git = "https://github.com/emberglazee/jemallocator", rev = "fca9a5ea15704a0bff6685c5d4f07c4ef01fa8b8" }

[profile.release]
strip = true
lto = "thin"
