[package]
name = "server"
version = "0.23.1"
edition = "2024"

[dependencies]
tower-lsp-server = "0.23.0"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
nom = "8.0.0"
nom_locate = "5.0.0"
dashmap = { version = "6.2.1", features = ["serde"] }
once_cell = "1.21.4"
regex = "1.13.1"
futures = "0.3.33"
sysinfo = "0.39.6"
base64 = "0.23.0"
arc-swap = "1.9.1"
paste = { package = "pastey", version = "0.2.3" }
rustc-hash = "2.1.3"
smallvec = "1.15.2"
tikv-jemallocator = "0.7.0"
tokio-util = "0.7.19"

[patch.crates-io]
tikv-jemalloc-sys = { git = "https://github.com/emberglazee/jemallocator", rev = "da06d4a" }
tikv-jemallocator = { git = "https://github.com/emberglazee/jemallocator", rev = "da06d4a" }

[profile.release]
strip = true
lto = "thin"
