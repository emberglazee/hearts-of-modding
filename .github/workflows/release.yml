name: Release

run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # NEVER cancel a side-effecting release: a cancel landing between the bump
  # push and release creation would leave main bumped with no release.
  # Re-run safety comes from the tag guard + CHANGELOG checks in the bump job.
  cancel-in-progress: false

jobs:
  # ── Version bump FIRST: every downstream artifact (server binaries, VSIX, ──
  # ── the tag) must describe one and the same commit. Building before the   ──
  # ── bump shipped binaries whose CARGO_PKG_VERSION was the PREVIOUS         ──
  # ── release's (the v0.31.0 asset self-reported 0.30.0).                    ──
  bump:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.VERSION }}
      sha: ${{ steps.bump.outputs.SHA }}
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump Version
        id: bump
        run: |
          cd client

          if [ "${{ inputs.bump }}" != "none" ]; then
            npm version ${{ inputs.bump }} --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")

          # ── Re-run safety: never publish a version that is already tagged. ──
          # ls-remote exit codes: 0 = tag exists, 2 = no match, anything else
          # = the query itself failed (abort rather than skip the guard).
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /tmp/lsremote.txt 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Tag v$VERSION already exists on origin — that release is already published. If a previous run pushed the bump but never published it, re-dispatch with bump = none to release the current tree."
            exit 1
          elif [ "$rc" -ne 2 ]; then
            echo "::error::Could not query origin tags (exit $rc):"
            cat /tmp/lsremote.txt
            exit 1
          fi

          # ── The CHANGELOG must already carry this version, BEFORE pushing. ──
          if ! grep -q "^## \[v$VERSION\]" ../CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [v$VERSION]' section — add it (and commit it) before dispatching this release."
            exit 1
          fi
          if [ "${{ inputs.bump }}" != "none" ]; then
            staged=$(sed -nE 's/^## \[v([^]]+)\].*/\1/p' ../CHANGELOG.md | head -1)
            if [ "$staged" != "$VERSION" ]; then
              echo "::error::CHANGELOG.md stages v$staged but this dispatch computes v$VERSION — stage that section, or dispatch the bump type it corresponds to."
              exit 1
            fi
          fi

          if [ "${{ inputs.bump }}" != "none" ]; then
            sed -i "0,/^version = .*/s//version = \"$VERSION\"/" ../server/Cargo.toml

            # Fail fast if the sed above did not land: a silent no-op would
            # commit a bumped package.json with a stale Cargo.toml.
            grep -q "^version = \"$VERSION\"$" ../server/Cargo.toml || {
              echo "::error::server/Cargo.toml version was not updated to $VERSION"
              exit 1
            }

            # Sync hom-lsp's OWN version line in Cargo.lock. The previous
            # approach (`cargo generate-lockfile`) re-resolved the whole
            # dependency graph, silently upgrading unrelated crates inside
            # this commit — and the release shipped binaries built from the
            # pre-bump lock. Edit the entry directly instead.
            python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          lock = pathlib.Path("../server/Cargo.lock")
          text = lock.read_text()
          new_text, count = re.subn(
              r'(\[\[package\]\]\nname = "hom-lsp"\nversion = )"[^"]+"',
              lambda m: m.group(1) + '"' + version + '"',
              text,
              count=1,
          )
          if count != 1:
              sys.exit(f"hom-lsp entry not found in Cargo.lock (matches={count})")
          lock.write_text(new_text)
          PY

            # The only permitted lockfile change is that single version line.
            added=$(git diff --numstat -- ../server/Cargo.lock | cut -f1)
            removed=$(git diff --numstat -- ../server/Cargo.lock | cut -f2)
            if [ "$added" != "1" ] || [ "$removed" != "1" ]; then
              echo "::error::Cargo.lock churn: expected exactly 1 added + 1 removed line (hom-lsp version), got +$added/-$removed"
              git diff -- ../server/Cargo.lock
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json ../server/Cargo.toml ../server/Cargo.lock
            git commit -m "chore: bump version to $VERSION"
            git push
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # ── Server binaries build from the BUMPED commit, so each binary ──
  # ── self-reports the version its release tag names.               ──
  build-server:
    needs: bump
    uses: ./.github/workflows/server-build.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  lint-client:
    name: Lint Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: |
          cd client
          npm ci

      - name: Lint
        run: |
          cd client
          npm run lint

  create-release:
    name: Create Release
    needs: [bump, build-server, lint-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Pin the whole job to the exact commit the binaries were built
          # from (the bump commit), not the branch head.
          ref: ${{ needs.bump.outputs.sha }}
          # Full history + tags: the release description script counts
          # contributions since the previous release tag (git describe/
          # rev-list) and resolves heads to SHAs for the compare API.
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd client
          npm ci

      - name: Download Server Binaries
        uses: actions/download-artifact@v8
        with:
          path: bin-stage
          pattern: hom-lsp-*

      - name: Extract Release Notes
        # Changelog sections + contributor medals since the previous release
        # tag (git describe); PR authors are resolved via the GitHub compare
        # and pulls APIs, so the step needs a token and full history.
        run: |
          python .github/scripts/generate_release_description.py > release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Binaries
        run: |
          mkdir -p client/server-bin release-assets
          # Bundle the three primary combos inside the VSIX
          cp bin-stage/hom-lsp-linux-amd64/hom-lsp client/server-bin/hom-lsp-linux-amd64
          cp bin-stage/hom-lsp-win-amd64.exe/hom-lsp.exe client/server-bin/hom-lsp-win-amd64.exe
          cp bin-stage/hom-lsp-macos-arm64/hom-lsp client/server-bin/hom-lsp-macos-arm64
          # Standalone binaries for ALL six combos (published alongside the VSIX)
          cp bin-stage/hom-lsp-linux-amd64/hom-lsp release-assets/hom-lsp-linux-amd64
          cp bin-stage/hom-lsp-linux-arm64/hom-lsp release-assets/hom-lsp-linux-arm64
          cp bin-stage/hom-lsp-win-amd64.exe/hom-lsp.exe release-assets/hom-lsp-win-amd64.exe
          cp bin-stage/hom-lsp-win-arm64.exe/hom-lsp.exe release-assets/hom-lsp-win-arm64.exe
          cp bin-stage/hom-lsp-macos-arm64/hom-lsp release-assets/hom-lsp-macos-arm64
          cp bin-stage/hom-lsp-macos-amd64/hom-lsp release-assets/hom-lsp-macos-amd64
          chmod +x client/server-bin/hom-lsp-linux-amd64 client/server-bin/hom-lsp-macos-arm64
          chmod +x release-assets/hom-lsp-linux-* release-assets/hom-lsp-macos-*
          mv README.md client/README.md
          mv CHANGELOG.md client/CHANGELOG.md

      - name: Package VSIX
        run: |
          cd client
          npm run compile
          npx vsce package -o ../hearts-of-modding-${{ needs.bump.outputs.version }}.vsix

      # Checksums for every published artifact. The extension downloads this
      # file alongside a standalone binary and verifies the bytes before
      # caching them, which catches truncated downloads and proxy/captive-portal
      # HTML served with a 200. Users can verify manually with
      # `sha256sum -c SHA256SUMS`.
      - name: Generate SHA256SUMS
        run: |
          cp hearts-of-modding-${{ needs.bump.outputs.version }}.vsix release-assets/
          cd release-assets
          # Bare filenames (no ./ prefix) so the client can match on the asset
          # name exactly as it requests it.
          sha256sum hom-lsp-* *.vsix > SHA256SUMS
          # Drop the VSIX copy again — it is published from the repo root.
          rm -f *.vsix
          echo "── SHA256SUMS ──"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: v${{ needs.bump.outputs.version }}
          # Pin the tag to the exact commit the artifacts were built from,
          # instead of whatever the default branch happens to point at.
          target_commitish: ${{ needs.bump.outputs.sha }}
          files: |
            hearts-of-modding-${{ needs.bump.outputs.version }}.vsix
            release-assets/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.bump.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Open VSX Registry
        run: |
          npx ovsx publish hearts-of-modding-${{ needs.bump.outputs.version }}.vsix --pat ${{ secrets.OPEN_VSX_TOKEN }}

      # Run names are fixed at trigger time ("Release (minor)") before the
      # version bump runs, so the actual version is invisible from the Actions
      # list.  This step writes the released version — plus the bump type and
      # the previous version — to the job summary so it shows up on the run's
      # Summary tab.
      - name: Release Summary
        if: always() && needs.bump.outputs.version
        run: |
          python .github/scripts/generate_release_summary.py \
            --version ${{ needs.bump.outputs.version }} \
            --bump ${{ inputs.bump }}
