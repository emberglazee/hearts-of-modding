name: Build Server (Reusable)

on:
  workflow_call:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Formatting Check
        run: |
          cd server
          cargo fmt --check

      - name: Clippy
        run: |
          cd server
          cargo clippy -- --deny warnings

      - name: Test
        run: |
          cd server
          cargo test
        env:
          RUST_BACKTRACE: 1

  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Native builds on each platform/arch. Only macOS amd64 is cross-built
          # (from the arm64 macos runner — GitHub's Intel mac runners are scarce).
          # Asset names follow `hom-lsp-<os>-<arch>[.exe]` — the client's fetch table.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: hom-lsp-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: hom-lsp-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: hom-lsp-win-amd64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: hom-lsp-win-arm64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: hom-lsp-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: hom-lsp-macos-amd64
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Build Server
        shell: bash
        run: |
          cd server
          cargo build --release --target ${{ matrix.target }}

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            server/target/${{ matrix.target }}/release/hom-lsp
            server/target/${{ matrix.target }}/release/hom-lsp.exe
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Run Tests
        run: |
          cd server
          cargo test
        env:
          RUST_BACKTRACE: 1
