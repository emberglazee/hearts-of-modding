name: Build Server (Reusable)

on:
  workflow_call:

jobs:
  # ── Static gate: formatting + lint, fast feedback on the cheapest runner. ──
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Formatting Check
        run: |
          cd server
          cargo fmt --check

      - name: Clippy
        run: |
          cd server
          cargo clippy -- --deny warnings

  # ── Native test matrix: every target that gets a release binary, tested on
  # ── its own runner. macOS amd64 is excluded — it is a cross-build from the
  # ── arm64 macos runner (no Intel mac runners), not a native target. ──
  test:
    name: Test (${{ matrix.os }} - ${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Run Tests
        run: |
          cd server
          cargo test
        env:
          RUST_BACKTRACE: 1

  # ── Release builds: only after ALL native tests pass (check + 5-target
  # ── matrix). Builds 6 combos; asset names follow hom-lsp-<os>-<arch>[.exe]. ──
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Native builds on each platform/arch. Only macOS amd64 is cross-built
          # (from the arm64 macos runner — GitHub's Intel mac runners are scarce).
          # Asset names follow `hom-lsp-<os>-<arch>[.exe]` — the client's fetch table.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: hom-lsp-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: hom-lsp-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: hom-lsp-win-amd64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: hom-lsp-win-arm64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: hom-lsp-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: hom-lsp-macos-amd64
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Build Server
        shell: bash
        run: |
          cd server
          cargo build --release --target ${{ matrix.target }}

      - name: Smoke Test Server Startup
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $server = Resolve-Path "server/target/${{ matrix.target }}/release/hom-lsp.exe"
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe not found"
          }
          $dependencies = & $dumpbin.FullName /dependents $server | Out-String
          if ($dependencies -match 'VCRUNTIME[0-9_]*\.dll') {
            throw "hom-lsp still depends on the Visual C++ Redistributable: $dependencies"
          }
          $request = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"capabilities":{}}}'
          $framed = "Content-Length: $([Text.Encoding]::UTF8.GetByteCount($request))`r`n`r`n$request"
          $process = [Diagnostics.Process]::new()
          $process.StartInfo.FileName = $server
          $process.StartInfo.Arguments = "--stdio"
          $process.StartInfo.UseShellExecute = $false
          $process.StartInfo.RedirectStandardInput = $true
          $process.StartInfo.RedirectStandardOutput = $true
          $process.StartInfo.RedirectStandardError = $true
          $process.StartInfo.CreateNoWindow = $true
          [void] $process.Start()
          $responseTask = $process.StandardOutput.ReadToEndAsync()
          $errorTask = $process.StandardError.ReadToEndAsync()
          $bytes = [Text.Encoding]::UTF8.GetBytes($framed)
          $process.StandardInput.BaseStream.Write($bytes, 0, $bytes.Length)
          $process.StandardInput.Close()
          if (-not $process.WaitForExit(15000)) {
            $process.Kill($true)
            throw "hom-lsp did not exit after stdin closed"
          }
          $response = $responseTask.GetAwaiter().GetResult()
          $errorOutput = $errorTask.GetAwaiter().GetResult()
          if ($process.ExitCode -ne 0) {
            throw "hom-lsp exited with code $($process.ExitCode): $errorOutput"
          }
          if ($response -notmatch '"id":1' -or $response -notmatch '"capabilities"') {
            throw "hom-lsp did not return an initialize response: $response"
          }

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            server/target/${{ matrix.target }}/release/hom-lsp
            server/target/${{ matrix.target }}/release/hom-lsp.exe
          if-no-files-found: error
