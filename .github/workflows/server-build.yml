name: Build Server (Reusable)

on:
  workflow_call:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Formatting Check
        run: |
          cd server
          cargo fmt --check

      - name: Clippy
        run: |
          cd server
          cargo clippy -- --deny warnings

      - name: Test
        run: |
          cd server
          cargo test
        env:
          RUST_BACKTRACE: 1

  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Primary (bundled in the VSIX) + cross-compiled (standalone release assets).
          # Asset names follow `hom-lsp-<os>-<arch>[.exe]` — the client's fetch table.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: hom-lsp-linux-amd64
            zig: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: hom-lsp-linux-arm64
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: hom-lsp-win-amd64.exe
            zig: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: hom-lsp-win-arm64.exe
            zig: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: hom-lsp-macos-arm64
            zig: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: hom-lsp-macos-amd64
            zig: false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Setup Zig (Linux ARM64 cross-compile)
        if: matrix.zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild (Linux ARM64 cross-compile)
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked

      - name: Build Server
        shell: bash
        run: |
          cd server
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            server/target/${{ matrix.target }}/release/hom-lsp
            server/target/${{ matrix.target }}/release/hom-lsp.exe
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Run Tests
        run: |
          cd server
          cargo test
        env:
          RUST_BACKTRACE: 1
